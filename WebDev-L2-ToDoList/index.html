<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>To-Do App</title>
    <style>
      :root {
        --bg: #eef2ee;
        --surface: #ffffff;
        --ink: #1d2b24;
        --muted: #6b7a72;
        --line: #d6ded8;
        --accent: #2f6f55;
        --accent-ink: #ffffff;
        --danger: #b3402f;
        --done: #8a978f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.5;
      }
      .app {
        max-width: 640px;
        margin: 0 auto;
        padding: 32px 16px 64px;
      }

      h1 {
        font-size: 2rem;
        margin: 0 0 20px;
        letter-spacing: -0.5px;
      }

      .add-form {
        display: flex;
        gap: 8px;
        margin-bottom: 28px;
      }

      .add-form input {
        flex: 1;
        padding: 12px 14px;
        font: inherit;
        border: 2px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }
      button {
        font: inherit;
        cursor: pointer;
        border-radius: 8px;
        border: 2px solid var(--accent);
        background: var(--surface);
        color: var(--accent);
        padding: 6px 12px;
      }
      button:hover {
        background: var(--accent);
        color: var(--accent-ink);
      }

      button.primary {
        background: var(--accent);
        color: var(--accent-ink);
        padding: 12px 20px;
      }

      button.primary:hover {
        background: #245944;
      }

      button.delete {
        border-color: var(--danger);
        color: var(--danger);
      }

      button.delete:hover {
        background: var(--danger);
        color: #fff;
      }

      :focus-visible {
        outline: 3px solid #e0a82e;
        outline-offset: 2px;
      }

      section {
        background: var(--surface);
        border-radius: 12px;
        padding: 16px 18px;
        margin-bottom: 24px;
        border: 1px solid var(--line);
      }
      section h2 {
        margin: 0 0 12px;
        font-size: 1.15rem;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .count {
        font-size: 0.9rem;
        color: var(--muted);
        font-weight: normal;
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 0;
        border-top: 1px solid var(--line);
        flex-wrap: wrap;
      }
      li:first-child {
        border-top: 0;
      }
      .task-body {
        flex: 1;
        min-width: 160px;
      }
      .task-text {
        word-break: break-word;
      }
      .task-time {
        font-size: 0.8rem;
        color: var(--muted);
      }
      li.done .task-text {
        text-decoration: line-through;
        color: var(--done);
      }
      .edit-input {
        width: 100%;
        padding: 6px 8px;
        font: inherit;
        border: 2px solid var(--accent);
        border-radius: 6px;
      }
      .actions {
        display: flex;
        gap: 6px;
      }
      .empty {
        color: var(--muted);
        font-style: italic;
        padding: 8px 0;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1>My Tasks</h1>

      <form class="add-form" id="add-form">
        <input
          type="text"
          id="task-input"
          placeholder="What needs to be done?"
          aria-label="New task"
          autocomplete="off"
        />
        <button type="submit" class="primary">Add Task</button>
      </form>

      <section>
        <h2>
          Pending Tasks <span class="count" id="pending-count">0 pending</span>
        </h2>
        <ul id="pending-list"></ul>
      </section>

      <section>
        <h2>
          Completed Tasks
          <span class="count" id="completed-count">0 completed</span>
        </h2>
        <ul id="completed-list"></ul>
      </section>
    </main>

    <script>
      const STORAGE_KEY = "todo-tasks";

      // ---------- State ----------
      let tasks = loadTasks(); // [{ id, text, completed, createdAt, completedAt }]
      let editingId = null; // id of the task currently being edited

      function loadTasks() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        } catch (e) {
          return [];
        }
      }

      function saveTasks() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        } catch (e) {
          console.warn("Could not save tasks:", e);
        }
      }

      // ---------- DOM refs ----------
      const form = document.getElementById("add-form");
      const input = document.getElementById("task-input");
      const pendingList = document.getElementById("pending-list");
      const completedList = document.getElementById("completed-list");
      const pendingCount = document.getElementById("pending-count");
      const completedCount = document.getElementById("completed-count");

      // ---------- Actions ----------
      function addTask(text) {
        tasks.unshift({
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          text,
          completed: false,
          createdAt: Date.now(),
          completedAt: null,
        });
        update();
      }

      function toggleTask(id) {
        const t = tasks.find((t) => t.id === id);
        t.completed = !t.completed;
        t.completedAt = t.completed ? Date.now() : null;
        update();
      }

      function deleteTask(id) {
        tasks = tasks.filter((t) => t.id !== id);
        if (editingId === id) editingId = null;
        update();
      }

      function saveEdit(id, newText) {
        const text = newText.trim();
        if (text) tasks.find((t) => t.id === id).text = text;
        editingId = null;
        update();
      }

      function update() {
        saveTasks();
        render();
      }

      // ---------- Rendering ----------
      function formatTime(ms) {
        return new Date(ms).toLocaleString([], {
          dateStyle: "medium",
          timeStyle: "short",
        });
      }

      function createItem(task) {
        const li = document.createElement("li");
        if (task.completed) li.classList.add("done");

        // Mark complete toggle
        const check = document.createElement("input");
        check.type = "checkbox";
        check.checked = task.completed;
        check.setAttribute(
          "aria-label",
          task.completed ? "Mark as pending" : "Mark complete",
        );
        check.addEventListener("change", () => toggleTask(task.id));
        li.appendChild(check);

        const body = document.createElement("div");
        body.className = "task-body";

        if (editingId === task.id) {
          // Inline edit mode
          const edit = document.createElement("input");
          edit.type = "text";
          edit.className = "edit-input";
          edit.value = task.text;
          edit.setAttribute("aria-label", "Edit task text");
          edit.addEventListener("keydown", (e) => {
            if (e.key === "Enter") saveEdit(task.id, edit.value);
            if (e.key === "Escape") {
              editingId = null;
              render();
            }
          });
          body.appendChild(edit);
          li.appendChild(body);

          const actions = document.createElement("div");
          actions.className = "actions";
          const saveBtn = document.createElement("button");
          saveBtn.textContent = "Save";
          saveBtn.addEventListener("click", () =>
            saveEdit(task.id, edit.value),
          );
          const cancelBtn = document.createElement("button");
          cancelBtn.textContent = "Cancel";
          cancelBtn.addEventListener("click", () => {
            editingId = null;
            render();
          });
          actions.append(saveBtn, cancelBtn);
          li.appendChild(actions);

          setTimeout(() => edit.focus(), 0);
          return li;
        }

        // Normal mode (textContent prevents HTML injection)
        const text = document.createElement("div");
        text.className = "task-text";
        text.textContent = task.text;

        const time = document.createElement("div");
        time.className = "task-time";
        time.textContent = task.completed
          ? `Added ${formatTime(task.createdAt)} · Completed ${formatTime(task.completedAt)}`
          : `Added ${formatTime(task.createdAt)}`;

        body.append(text, time);
        li.appendChild(body);

        const actions = document.createElement("div");
        actions.className = "actions";

        const editBtn = document.createElement("button");
        editBtn.textContent = "Edit";
        editBtn.addEventListener("click", () => {
          editingId = task.id;
          render();
        });

        const delBtn = document.createElement("button");
        delBtn.textContent = "Delete";
        delBtn.className = "delete";
        delBtn.addEventListener("click", () => deleteTask(task.id));

        actions.append(editBtn, delBtn);
        li.appendChild(actions);
        return li;
      }

      function fillList(listEl, items, emptyMessage) {
        listEl.innerHTML = "";
        if (items.length === 0) {
          const p = document.createElement("li");
          p.className = "empty";
          p.textContent = emptyMessage;
          listEl.appendChild(p);
          return;
        }
        items.forEach((t) => listEl.appendChild(createItem(t)));
      }

      function render() {
        const pending = tasks.filter((t) => !t.completed);
        const completed = tasks.filter((t) => t.completed);

        pendingCount.textContent = `${pending.length} pending`;
        completedCount.textContent = `${completed.length} completed`;

        fillList(
          pendingList,
          pending,
          "Nothing to do right now. Add a task above to get started.",
        );
        fillList(
          completedList,
          completed,
          "No completed tasks yet. Finish one and it will show up here.",
        );
      }

      // ---------- Events ----------
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        addTask(text);
        input.value = "";
        input.focus();
      });

      render();
    </script>
  </body>
</html>
